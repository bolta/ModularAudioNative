[package]
name = "gui_controller"
version = "0.1.0"
authors = ["bolta <freshness.and.speed.2007@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
anyhow = "1.0.102"
bson = { version = "3.1.0", features = ["serde"] }
ipc = { path = "../ipc" }
rand = "0.8"
tokio = { version = "1.52.3", features = ["sync"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[build-dependencies]
cargo_metadata = "0.18"
